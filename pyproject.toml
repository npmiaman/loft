[project]
name = "loft"
version = "0.1.0"
description = "Loft: team browser profiles on Camoufox with end-to-end encryption"
readme = "README.md"
requires-python = ">=3.12"
# Base = what every install needs (the client, the server, the CLI parser).
# The browser (camoufox) and the server's DB/S3 drivers are extras, so a
# server image can skip the browser and a client can skip psycopg/boto3.
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "uvicorn>=0.54.0",
    "websockets>=17.4",
]

[project.optional-dependencies]
# Running a profile locally / a cloud runner: needs the browser.
client = ["camoufox[geoip]>=0.5.9", "socksio>=1.0.0"]
# Running only the cloud server: Postgres + S3 drivers, no browser.
server = ["psycopg[binary]>=3.3.9", "boto3>=1.44.12"]
# The desktop app: client plus the native-window library.
desktop = ["camoufox[geoip]>=0.5.9", "socksio>=1.0.0", "pywebview>=5"]
build = ["pyinstaller>=6"]

[project.scripts]
loft = "loft.cli:entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loft"]

[tool.uv]
# Local dev and the test suite need everything: browser, server drivers, moto.
default-groups = ["dev"]

[dependency-groups]
dev = [
    "camoufox[geoip]>=0.5.9",
    "socksio>=1.0.0",
    "psycopg[binary]>=3.3.9",
    "boto3>=1.44.12",
    "pywebview>=5",
    "moto[server]>=5.2.6",
    "pytest>=9.2.0",
]
