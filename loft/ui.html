<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Loft</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#16181d; --mute:#6b7280; --line:#e5e7eb; --acc:#2f6fed; --ok:#16a34a; --warn:#b45309; --bad:#dc2626; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --card:#171a21; --ink:#e7e9ee; --mute:#9aa1ad; --line:#272b35; --acc:#5b8cff; } }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; align-items:center; gap:16px; padding:12px 20px; border-bottom:1px solid var(--line); background:var(--card); position:sticky; top:0; }
  header b { font-size:16px; letter-spacing:.2px; }
  nav button { background:none; border:0; padding:6px 10px; border-radius:6px; color:var(--mute); cursor:pointer; font:inherit; }
  nav button.on { background:var(--bg); color:var(--ink); font-weight:600; }
  .sp { flex:1; }
  main { padding:20px; max-width:1200px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { font-size:12px; color:var(--mute); font-weight:500; text-transform:uppercase; letter-spacing:.4px; }
  tr:last-child td { border-bottom:0; }
  .mute { color:var(--mute); } .small { font-size:12px; }
  button.b { font:inherit; padding:6px 12px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; }
  button.b:hover { border-color:var(--acc); }
  button.p { background:var(--acc); border-color:var(--acc); color:#fff; }
  button.d { color:var(--bad); }
  button:disabled { opacity:.5; cursor:default; }
  input, select, textarea { font:inherit; padding:7px 9px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); width:100%; }
  label { display:block; margin:10px 0 4px; font-size:12px; color:var(--mute); }
  .pill { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; border:1px solid var(--line); }
  .run { color:var(--ok); border-color:var(--ok); } .busy { color:var(--warn); border-color:var(--warn); }
  .row { display:flex; gap:8px; align-items:center; }
  .toolbar { display:flex; gap:8px; align-items:center; margin-bottom:12px; }
  dialog { border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--ink); width:440px; padding:20px; }
  dialog::backdrop { background:rgba(0,0,0,.35); }
  .login { max-width:380px; margin:80px auto; padding:24px; }
  .err { color:var(--bad); min-height:18px; margin-top:8px; }
  .log { font:12px ui-monospace, Menlo, monospace; color:var(--mute); white-space:pre-wrap; }
  code { font:12px ui-monospace, Menlo, monospace; background:var(--bg); padding:2px 6px; border-radius:4px; }
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let S = null, tab = "profiles", filter = "";

async function api(method, path, body) {
  const r = await fetch("/api" + path, { method, headers: { "X-Loft": "1", "Content-Type": "application/json" },
                                         body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || r.statusText);
  return j;
}
async function load() { S = await api("GET", "/state"); render(); }
function canAdmin() { return S.role === "owner" || S.role === "admin"; }

function render() {
  if (!S.signed_in) return renderLogin();
  const teams = S.me.teams;
  $("#app").innerHTML = `
  <header>
    <b>Loft</b>
    <nav>${["profiles","team","activity"].map(t => `<button class="${tab===t?"on":""}" onclick="tab='${t}';render()">${t[0].toUpperCase()+t.slice(1)}</button>`).join("")}</nav>
    <span class="sp"></span>
    ${teams.length ? `<select style="width:auto" onchange="useTeam(this.value)">${teams.map(t => `<option value="${t.id}" ${t.id===S.team?"selected":""}>${esc(t.name)} · ${t.role}</option>`).join("")}</select>` : ""}
    <span class="mute small">${esc(S.me.email)} · ${esc(S.device)}</span>
    <button class="b" onclick="logout()">Sign out</button>
  </header>
  <main id="main"></main>`;
  if (!teams.length) return renderNoTeam();
  ({profiles: renderProfiles, team: renderTeam, activity: renderActivity})[tab]();
}

function renderLogin() {
  $("#app").innerHTML = `<div class="card login">
    <h2 style="margin-top:0">Sign in to Loft</h2>
    <label>Server</label><input id="srv" value="${esc(S.server || "http://127.0.0.1:4400")}">
    <label>Email</label><input id="em" autocomplete="username">
    <label>Password</label><input id="pw" type="password" autocomplete="current-password">
    <details style="margin-top:10px"><summary class="mute small">New account</summary>
      <label>Name</label><input id="nm"><label>Invite code (needed except for the first user)</label><input id="inv">
    </details>
    <div class="row" style="margin-top:16px"><button class="b p" onclick="login(false)">Sign in</button><button class="b" onclick="login(true)">Create account</button></div>
    <div class="err" id="err"></div></div>`;
}
async function login(register) {
  try {
    await api("POST", "/login", { server: $("#srv").value.trim(), email: $("#em").value.trim(), password: $("#pw").value,
      register, name: $("#nm").value, invite: $("#inv").value.trim() || null });
    await load();
  } catch (e) { $("#err").textContent = e.message; }
}
async function logout() { await api("POST", "/logout"); await load(); }
async function useTeam(id) { await api("POST", "/team/" + id); await load(); }

function renderNoTeam() {
  $("#main").innerHTML = `<div class="card" style="padding:20px;max-width:480px">
    <h3 style="margin-top:0">You're not in a team yet</h3>
    <label>Create a team</label><div class="row"><input id="tn" placeholder="Team name"><button class="b p" onclick="act(()=>api('POST','/teams',{name:$('#tn').value}))">Create</button></div>
    <label>Or join with an invite code</label><div class="row"><input id="jc"><button class="b" onclick="act(()=>api('POST','/join',{code:$('#jc').value}))">Join</button></div>
    <div class="err" id="err"></div></div>`;
}

async function act(fn) {
  try { await fn(); await load(); }
  catch (e) { const el = $("#err") || $("#derr"); if (el) el.textContent = e.message; else alert(e.message); }
}

function status(p) {
  const local = S.running[p.id];
  if (local && local.alive) return `<span class="pill run">running here</span>`;
  if (p.running) return `<span class="pill busy">in use: ${esc(p.running.by)} @ ${esc(p.running.device)}</span>`;
  return `<span class="mute small">${p.version ? "v" + p.version : "never run"}</span>`;
}

function renderProfiles() {
  const ps = S.profiles.filter(p => !filter || (p.name + " " + p.tags.join(" ") + " " + p.notes).toLowerCase().includes(filter));
  $("#main").innerHTML = `
  <div class="toolbar">
    <input style="max-width:280px" placeholder="Search name, tag, notes" value="${esc(filter)}" id="q" oninput="filter=this.value.toLowerCase();renderProfiles();const q=$('#q');q.focus();q.setSelectionRange(q.value.length,q.value.length)">
    <span class="sp"></span><button class="b p" onclick="newDlg()">New profile</button>
  </div>
  <div class="card"><table>
    <tr><th>Name</th><th>OS</th><th>Proxy</th><th>Tags</th><th>Status</th><th></th></tr>
    ${ps.map(p => {
      const busy = p.running || (S.running[p.id] && S.running[p.id].alive);
      const log = S.running[p.id] ? S.running[p.id].log.join("\n") : "";
      return `<tr>
        <td><b>${esc(p.name)}</b>${p.notes ? `<div class="mute small">${esc(p.notes)}</div>` : ""}${log ? `<div class="log">${esc(log)}</div>` : ""}</td>
        <td>${esc(p.os)}</td>
        <td class="small">${p.proxy ? esc(p.proxy.server) : '<span class="mute">direct</span>'}</td>
        <td class="small">${p.tags.map(t => `<span class="pill">${esc(t)}</span>`).join(" ")}</td>
        <td>${status(p)}</td>
        <td style="text-align:right;white-space:nowrap">
          <button class="b p" ${busy ? "disabled" : ""} onclick="act(()=>api('POST','/profiles/${p.id}/run'))">Run</button>
          ${p.access === "edit" ? `<button class="b" onclick="editDlg(${p.id})">Edit</button><button class="b" onclick="shareDlg(${p.id})">Share</button>` : `<span class="mute small">run only</span>`}
          ${p.running && canAdmin() && !(S.running[p.id] && S.running[p.id].alive) ? `<button class="b d" onclick="if(confirm('Force-release the lock? Unsynced changes on the other device will be rejected.'))act(()=>api('POST','/profiles/${p.id}/unlock'))">Unlock</button>` : ""}
        </td></tr>`; }).join("") || `<tr><td colspan="6" class="mute">No profiles yet.</td></tr>`}
  </table></div>
  <p class="mute small">Each profile keeps one fingerprint for life and its cookies and storage sync to the server when you close the browser. Only one person can run a profile at a time.</p>`;
}

function dlg(html) { const d = $("#dlg"); d.innerHTML = html + `<div class="err" id="derr"></div>`; d.showModal(); }
function close_() { $("#dlg").close(); }

function newDlg() {
  dlg(`<h3 style="margin-top:0">New profile</h3>
    <label>Name</label><input id="n_name">
    <label>OS fingerprint</label><select id="n_os"><option>windows</option><option>macos</option><option>linux</option></select>
    <label>Proxy (optional) — scheme://user:pass@host:port</label><input id="n_proxy" placeholder="http://user:pass@1.2.3.4:8080">
    <label>Start URL</label><input id="n_url" placeholder="https://">
    <label>Tags (comma separated)</label><input id="n_tags">
    <label>Notes</label><input id="n_notes">
    <div class="row" style="margin-top:16px"><button class="b p" id="n_go" onclick="createProfile()">Create</button><button class="b" onclick="close_()">Cancel</button></div>`);
}
async function createProfile() {
  $("#n_go").disabled = true; $("#n_go").textContent = "Generating fingerprint…";
  try {
    await api("POST", "/profiles", { name: $("#n_name").value.trim(), os: $("#n_os").value, proxy: $("#n_proxy").value.trim(),
      start_url: $("#n_url").value.trim(), notes: $("#n_notes").value, tags: $("#n_tags").value.split(",").map(s => s.trim()).filter(Boolean) });
    close_(); await load();
  } catch (e) { $("#derr").textContent = e.message; $("#n_go").disabled = false; $("#n_go").textContent = "Create"; }
}

function editDlg(id) {
  const p = S.profiles.find(x => x.id === id);
  const px = p.proxy ? (p.proxy.username ? p.proxy.server.replace("://", `://${p.proxy.username}:${p.proxy.password || ""}@`) : p.proxy.server) : "";
  dlg(`<h3 style="margin-top:0">Edit ${esc(p.name)}</h3>
    <label>Name</label><input id="e_name" value="${esc(p.name)}">
    <label>Proxy (empty = direct)</label><input id="e_proxy" value="${esc(px)}">
    <label>Start URL</label><input id="e_url" value="${esc(p.start_url)}">
    <label>Notes</label><input id="e_notes" value="${esc(p.notes)}">
    <p class="mute small">The fingerprint (${esc(p.os)}) is fixed for this profile's life.</p>
    <div class="row" style="margin-top:16px">
      <button class="b p" onclick="act(async()=>{await api('PATCH','/profiles/${id}',{name:$('#e_name').value,proxy:$('#e_proxy').value,start_url:$('#e_url').value,notes:$('#e_notes').value});close_()})">Save</button>
      <button class="b" onclick="close_()">Cancel</button><span class="sp"></span>
      <button class="b d" onclick="if(confirm('Delete this profile for the whole team?'))act(async()=>{await api('DELETE','/profiles/${id}');close_()})">Delete</button>
    </div>`);
}

async function shareDlg(id) {
  const p = S.profiles.find(x => x.id === id);
  const shares = await api("GET", `/profiles/${id}/shares`);
  const others = S.members.filter(m => m.role === "member" && m.id !== p.created_by);
  dlg(`<h3 style="margin-top:0">Share ${esc(p.name)}</h3>
    <p class="mute small">Owners and admins see every profile. Members only see profiles they made or that are shared with them. <b>Run</b> can open it, and <b>Edit</b> can also change settings and sharing.</p>
    <table>${others.map(m => { const s = shares.find(x => x.user_id === m.id);
      return `<tr><td>${esc(m.email)}</td><td><select onchange="setShare(${id},${m.id},this.value)">
        <option value="" ${!s?"selected":""}>no access</option><option value="run" ${s&&s.level==="run"?"selected":""}>run</option><option value="edit" ${s&&s.level==="edit"?"selected":""}>edit</option></select></td></tr>`; }).join("")
      || `<tr><td class="mute">No members to share with. Invite people from the Team tab.</td></tr>`}</table>
    <div class="row" style="margin-top:16px"><button class="b" onclick="close_()">Done</button></div>`);
}
async function setShare(pid, uid, level) {
  try { level ? await api("POST", `/profiles/${pid}/shares`, { user_id: uid, level }) : await api("DELETE", `/profiles/${pid}/shares/${uid}`); }
  catch (e) { $("#derr").textContent = e.message; }
}

function renderTeam() {
  const admin = canAdmin(), owner = S.role === "owner";
  $("#main").innerHTML = `
  ${admin ? `<div class="toolbar"><select id="irole" style="width:auto"><option>member</option><option>admin</option></select>
    <button class="b p" onclick="invite()">Create invite code</button><span id="icode"></span></div>` : ""}
  <div class="card"><table><tr><th>Member</th><th>Role</th><th></th></tr>
  ${S.members.map(m => `<tr><td>${esc(m.name)} <span class="mute small">${esc(m.email)}</span></td>
    <td>${admin && m.id !== S.me.id && (owner || m.role !== "owner") ? `<select style="width:auto" onchange="act(()=>api('POST','/members/${m.id}/role',{role:this.value}))">
      ${["member","admin"].concat(owner ? ["owner"] : []).map(r => `<option ${r===m.role?"selected":""}>${r}</option>`).join("")}</select>` : esc(m.role)}</td>
    <td style="text-align:right">${admin && m.id !== S.me.id && (owner || m.role !== "owner") ? `<button class="b d" onclick="if(confirm('Remove ${esc(m.email)}?'))act(()=>api('DELETE','/members/${m.id}'))">Remove</button>` : ""}</td></tr>`).join("")}
  </table></div>
  <div class="card" style="padding:16px;margin-top:16px;max-width:480px">
    <label style="margin-top:0">Join another team</label><div class="row"><input id="jc" placeholder="invite code"><button class="b" onclick="act(()=>api('POST','/join',{code:$('#jc').value}))">Join</button></div>
    <label>Create another team</label><div class="row"><input id="tn"><button class="b" onclick="act(()=>api('POST','/teams',{name:$('#tn').value}))">Create</button></div>
    <div class="err" id="err"></div></div>`;
}
async function invite() {
  try { const r = await api("POST", "/invite", { role: $("#irole").value });
    $("#icode").innerHTML = `Code: <code>${esc(r.code)}</code> <span class="mute small">(${esc(r.role)}, valid 7 days, single use)</span>`; }
  catch (e) { alert(e.message); }
}

async function renderActivity() {
  if (!canAdmin()) { $("#main").innerHTML = `<p class="mute">Only owners and admins can see team activity.</p>`; return; }
  const rows = await api("GET", "/audit");
  const name = id => (S.profiles.find(p => p.id === id) || {}).name || (id ? "#" + id : "");
  $("#main").innerHTML = `<div class="card"><table><tr><th>When</th><th>Who</th><th>What</th><th>Profile</th><th>Detail</th></tr>
    ${rows.map(a => `<tr><td class="small">${new Date(a.at*1000).toLocaleString()}</td><td class="small">${esc(a.email)}</td>
      <td>${esc(a.action)}</td><td>${esc(name(a.profile_id))}</td><td class="small mute">${esc(a.detail)}</td></tr>`).join("")}</table></div>`;
}

load().catch(e => { $("#app").innerHTML = `<p class="err" style="padding:20px">${esc(e.message)}</p>`; });
setInterval(() => { if (S && S.signed_in && tab === "profiles" && !$("#dlg").open) load().catch(() => {}); }, 3000);
</script>
</body>
</html>
