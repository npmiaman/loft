<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Loft</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#16181d; --mute:#6b7280; --line:#e5e7eb; --acc:#2f6fed; --ok:#16a34a; --warn:#b45309; --bad:#dc2626; --soft:#eef3ff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --card:#171a21; --ink:#e7e9ee; --mute:#9aa1ad; --line:#272b35; --acc:#5b8cff; --soft:#1b2233; } }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; align-items:center; gap:16px; padding:12px 20px; border-bottom:1px solid var(--line); background:var(--card); position:sticky; top:0; z-index:2; }
  header b { font-size:16px; }
  nav button { background:none; border:0; padding:6px 10px; border-radius:6px; color:var(--mute); cursor:pointer; font:inherit; }
  nav button.on { background:var(--bg); color:var(--ink); font-weight:600; }
  .sp { flex:1; }
  main { padding:20px; max-width:1240px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; }
  .pad { padding:16px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { font-size:12px; color:var(--mute); font-weight:500; text-transform:uppercase; letter-spacing:.4px; }
  tr:last-child td { border-bottom:0; }
  .mute { color:var(--mute); } .small { font-size:12px; }
  button.b { font:inherit; padding:6px 12px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; }
  button.b:hover { border-color:var(--acc); }
  button.p { background:var(--acc); border-color:var(--acc); color:#fff; }
  button.d { color:var(--bad); }
  button:disabled { opacity:.5; cursor:default; }
  input, select, textarea { font:inherit; padding:7px 9px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); width:100%; }
  textarea { font:12px ui-monospace, Menlo, monospace; min-height:90px; }
  label { display:block; margin:10px 0 4px; font-size:12px; color:var(--mute); }
  .pill { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; border:1px solid var(--line); }
  .run { color:var(--ok); border-color:var(--ok); } .busy { color:var(--warn); border-color:var(--warn); }
  .row { display:flex; gap:8px; align-items:center; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:0 12px; }
  .toolbar { display:flex; gap:8px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
  dialog { border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--ink); width:480px; max-width:95vw; padding:20px; }
  dialog::backdrop { background:rgba(0,0,0,.35); }
  .login { max-width:400px; margin:70px auto; padding:24px; }
  .err { color:var(--bad); min-height:18px; margin-top:8px; }
  .log { font:12px ui-monospace, Menlo, monospace; color:var(--mute); white-space:pre-wrap; max-width:520px; }
  code { font:12px ui-monospace, Menlo, monospace; background:var(--bg); padding:2px 6px; border-radius:4px; word-break:break-all; }
  .banner { background:var(--soft); border:1px solid var(--line); border-radius:10px; padding:12px 16px; margin-bottom:14px; display:flex; gap:12px; align-items:center; }
  .menu { position:relative; display:inline-block; }
  .menu > div { display:none; position:absolute; right:0; top:110%; background:var(--card); border:1px solid var(--line); border-radius:8px; min-width:170px; z-index:3; box-shadow:0 6px 24px rgba(0,0,0,.12); }
  .menu.open > div { display:block; }
  .menu > div button { display:block; width:100%; text-align:left; background:none; border:0; padding:8px 12px; font:inherit; color:var(--ink); cursor:pointer; }
  .menu > div button:hover { background:var(--bg); }
  h3 { margin:0 0 6px; }
  .section { margin-top:22px; }
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let S = null, tab = "profiles", filter = "";

async function api(method, path, body, raw) {
  const r = await fetch("/api" + path, { method, headers: { "X-Loft": "1", "Content-Type": "application/json" },
                                         body: body ? JSON.stringify(body) : undefined });
  if (raw && r.ok) return r;
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof j.detail === "string" ? j.detail : JSON.stringify(j.detail || r.statusText));
  return j;
}
async function load() { S = await api("GET", "/state"); render(); }
const canAdmin = () => S.role === "owner" || S.role === "admin";
const job = k => S.jobs && S.jobs[k];

function render() {
  if (!S.signed_in) return renderLogin();
  const teams = S.me.teams;
  $("#app").innerHTML = `
  <header>
    <b>Loft</b>
    <nav>${["profiles","team","activity"].concat(canAdmin() ? ["overview"] : []).map(t => `<button class="${tab===t?"on":""}" onclick="tab='${t}';render()">${NAV[t]}</button>`).join("")}</nav>
    <span class="sp"></span>
    ${teams.length ? `<select style="width:auto" onchange="act(()=>api('POST','/team/'+this.value))">${teams.map(t => `<option value="${t.id}" ${t.id===S.team?"selected":""}>${esc(t.name)} · ${t.role}</option>`).join("")}</select>` : ""}
    <span class="mute small">${esc(S.me.email)} · ${esc(S.device)}</span>
    <button class="b" onclick="act(()=>api('POST','/logout'))">Sign out</button>
  </header>
  <main id="main"></main>`;
  let top = "";
  const f = job("fetch");
  if (!S.browser) top += `<div class="banner"><div><b>Browser not installed.</b> <span class="mute">Camoufox is a one-time ~1.3 GB download.</span>
    ${f ? `<div class="log">${esc(f.log.join("\n"))}</div>` : ""}</div><span class="sp"></span>
    <button class="b p" ${f && f.alive ? "disabled" : ""} onclick="act(()=>api('POST','/browser/install'))">${f && f.alive ? "Downloading…" : "Install browser"}</button></div>`;
  if (teams.length && !S.has_key) top += `<div class="banner"><div><b>This device doesn't have the team's encryption key.</b>
    <span class="mute">Profiles are end-to-end encrypted. Join with the full invite code (it ends with <code>.key</code>), or sign in again with your password.</span></div></div>`;
  $("#main").innerHTML = top + `<div id="body"></div>`;
  if (!teams.length) return renderNoTeam();
  if (!S.has_key) return;
  ({profiles: renderProfiles, team: renderTeam, activity: renderActivity, overview: renderOverview}[tab] || renderProfiles)();
}

function renderLogin() {
  $("#app").innerHTML = `<div class="card login">
    <h2 style="margin-top:0">Sign in to Loft</h2>
    <label>Server</label><input id="srv" value="${esc(S.server || "http://127.0.0.1:4400")}">
    <label>Email</label><input id="em" autocomplete="username">
    <label>Password</label><input id="pw" type="password" autocomplete="current-password">
    <details style="margin-top:10px"><summary class="mute small">New account</summary>
      <label>Name</label><input id="nm"><label>Invite code (needed except for the first user)</label><input id="inv">
    </details>
    <details style="margin-top:6px"><summary class="mute small">Self-signed server certificate</summary>
      <label>Paste the server's cert.pem</label><textarea id="ca" placeholder="-----BEGIN CERTIFICATE-----"></textarea>
    </details>
    <div class="row" style="margin-top:16px"><button class="b p" onclick="login(false)">Sign in</button><button class="b" onclick="login(true)">Create account</button></div>
    <div class="err" id="err"></div></div>`;
}
async function login(signup) {
  try {
    $("#err").textContent = "Deriving keys…";
    await api("POST", "/login", { server: $("#srv").value.trim(), email: $("#em").value.trim(), password: $("#pw").value,
      signup, name: $("#nm").value, invite: $("#inv").value.trim() || null, ca: $("#ca").value || null });
    await load();
  } catch (e) { $("#err").textContent = e.message; }
}

function renderNoTeam() {
  $("#body").innerHTML = `<div class="card pad" style="max-width:480px">
    <h3>You're not in a team yet</h3>
    <label>Create a team</label><div class="row"><input id="tn" placeholder="Team name"><button class="b p" onclick="act(()=>api('POST','/teams',{name:$('#tn').value}))">Create</button></div>
    <label>Or join with an invite code</label><div class="row"><input id="jc"><button class="b" onclick="act(()=>api('POST','/join',{code:$('#jc').value}))">Join</button></div>
    <div class="err" id="err"></div></div>`;
}

async function act(fn, btn) {
  if (btn) { btn.disabled = true; }
  try { const r = await fn(); await load(); return r; }
  catch (e) { const el = ($("#dlg").open && $("#derr")) || $("#err"); if (el) el.textContent = e.message; else alert(e.message); }
  finally { if (btn) btn.disabled = false; }
}

// ---- plain-language helpers: one idea per screen, no jargon on the main path
const NAV = { profiles: "Accounts", team: "Team", activity: "Activity", overview: "Overview" };
const OPEN = new Set();   // <details> the person opened: the 3-second refresh redraws the page and must not close them
const people = n => n === 1 ? "1 person" : n + " people", msgs = n => n === 1 ? "1 message" : n + " messages";
const MODE = {};          // what each account's "Start Pigeon" will do, kept across redraws
let HOW_SEEN = false;
const det = (key, summary, body) => `<details ${OPEN.has(key) ? "open" : ""} ontoggle="this.open ? OPEN.add('${key}') : OPEN.delete('${key}')"><summary class="mute small" style="cursor:pointer">${summary}</summary>${body}</details>`;
const MODE_WORDS = { find: "finding people", dm: "sending approved messages", full: "finding people and messaging them" };
const JOB_WORDS = { scan: "adding the people on the page", replies: "checking for replies", doctor: "checking Reddit works", send: "sending a message",
                    post: "posting a comment", submit: "posting", setup: "reading your product", discover: "finding subreddits" };
function pigeonWords(pg) {
  if (pg.state === "stopping") return "Pigeon is stopping…";
  if (pg.state === "idle") return "Pigeon is off";
  return "Pigeon is " + ((pg.job === "run" ? MODE_WORDS[pg.mode] : JOB_WORDS[pg.job]) || "working");
}
function friendlyError(msg) {
  if (/proxy not working/i.test(msg)) return "This account's proxy isn't responding, so the browser was not opened (it would have used your own IP). Check the proxy in ⋯ → Edit.";
  return msg;
}
function acct(p) {   // what is going on with this account, in one sentence
  const j = job("run-" + p.id);
  if (p.running_here) return { cls: "run", text: "Open on this computer", sub: j && j.pigeon ? pigeonWords(j.pigeon) : "Starting…" };
  if (p.running) return { cls: "busy", text: `${p.running.by} is using it`, sub: "on " + p.running.device };
  const err = j && !j.alive && j.log.find(l => /^error:/i.test(l));
  if (err) return { cls: "", text: "Couldn't open", sub: "", err: err.replace(/^error:\s*/i, "") };
  return { cls: "", text: p.version ? "Closed · saved" : "Not opened yet", sub: "" };
}
const net = p => p.proxy ? `<span class="mute small">Own proxy · ${esc(p.proxy.server.replace(/^[a-z0-9]+:\/\//i, ""))}</span>`
                         : `<span class="small" style="color:var(--warn)">⚠ No proxy: uses your own IP</span>`;
function actions(p, pg, busy) {
  const id = p.id;
  if (!p.running_here) return `<button class="b p" ${busy ? "disabled" : ""} onclick="act(()=>api('POST','/profiles/${id}/run'),this)">Open browser</button>`;
  let h = "";
  if (pg) {
    h += pg.state !== "idle"
      ? `<button class="b" onclick="act(()=>api('POST','/profiles/${id}/pigeon',{action:'stop'}))">Stop Pigeon</button>`
      : `<select id="pm${id}" style="width:auto" title="What should Pigeon do?" onchange="MODE[${id}]=this.value">
           ${[["find", "Find people (sends nothing)"], ["full", "Find people + message them"], ["dm", "Send approved messages"]].map(([v, t]) => `<option value="${v}" ${(MODE[id] || "find") === v ? "selected" : ""}>${t}</option>`).join("")}</select>
         <button class="b p" onclick="act(()=>api('POST','/profiles/${id}/pigeon',{action:'start',mode:$('#pm${id}').value}))">Start Pigeon</button>`;
    h += `<button class="b" onclick="pgOpen(${id})">Pigeon controls</button>`;
  }
  return h + `<button class="b" onclick="act(()=>api('POST','/profiles/${id}/stop'),this)" title="Closes the browser and saves its cookies to the team">Close &amp; save</button>`;
}

function renderProfiles() {
  const ps = S.profiles.filter(p => !filter || (p.name + " " + p.tags.join(" ") + " " + p.notes).toLowerCase().includes(filter));
  if (!HOW_SEEN) { HOW_SEEN = true; if (!S.profiles.some(p => p.version)) OPEN.add("how"); }
  $("#body").innerHTML = `
  <div class="toolbar">
    <input id="q" style="max-width:280px" placeholder="Search accounts" value="${esc(filter)}"
      oninput="filter=this.value.toLowerCase();renderProfiles();const q=$('#q');q.focus();q.setSelectionRange(q.value.length,q.value.length)">
    <span class="sp"></span>
    <button class="b" onclick="importDlg()">Import</button>
    <button class="b" onclick="bulkDlg()">Add many</button>
    <button class="b p" onclick="newDlg()">Add account</button>
  </div>
  <div class="card pad" style="margin-bottom:12px">${det("how", "<b>How does this work?</b>", `<ol class="small" style="margin:8px 0 0;padding-left:18px">
    <li><b>Open browser.</b> Each account has its own browser and its own proxy. The first time, sign in to Reddit in it.</li>
    <li><b>Start Pigeon.</b> It finds people to talk to and writes the messages. Nothing is sent until you approve it, unless you turn that off.</li>
    <li><b>Pigeon controls → People.</b> Read, edit and approve the messages. Then press Start again to send.</li>
    <li><b>Close &amp; save.</b> Your login is saved (encrypted) so a teammate can open the same account later. Only one person can have an account open at a time.</li></ol>`)}</div>
  <div class="card"><table>
    <tr><th>Account</th><th>Status</th><th></th></tr>
    ${ps.map(row).join("") || `<tr><td colspan="3" class="mute">No accounts yet. Press <b>Add account</b>.</td></tr>`}
  </table></div>`;
}
function row(p) {
  const j = job("run-" + p.id), busy = p.running || p.running_here, edit = p.access === "edit", a = acct(p);
  const pg = p.running_here && j && j.pigeon;
  const raw = j && j.log.length ? det("log" + p.id, "Details", `<div class="log">${esc(j.log.join("\n"))}</div>`) : "";
  return `<tr>
    <td><b>${esc(p.name)}</b>
      <div>${net(p)} ${p.tags.map(t => `<span class="pill small">${esc(t)}</span>`).join(" ")}</div>
      ${p.notes ? `<div class="mute small">${esc(p.notes)}</div>` : ""}
      ${a.err ? `<div class="err small">${esc(friendlyError(a.err))}</div>` : ""}${raw}</td>
    <td><span class="pill ${a.cls}" style="white-space:nowrap">${esc(a.text)}</span>${a.sub ? `<div class="small" style="margin-top:4px">${esc(a.sub)}</div>` : ""}
      ${pg && pg.stats ? `<div class="mute small">found ${people(pg.stats.leads)} · sent ${msgs(pg.stats.dms)}</div>` : ""}</td>
    <td><div class="row" style="justify-content:flex-end;flex-wrap:wrap">
      ${actions(p, pg, busy)}
      ${S.runners.length ? `<button class="b" ${busy ? "disabled" : ""} onclick="cloud(${p.id},this)" title="Run on a cloud runner, view from any device">Cloud</button>` : ""}
      <span class="menu" id="m${p.id}"><button class="b" onclick="toggleMenu(${p.id},event)">⋯</button><div>
        ${edit ? `<button onclick="editDlg(${p.id})">Edit</button><button onclick="shareDlg(${p.id})">Share</button>` : ""}
        <button ${busy ? "disabled" : ""} onclick="cookieDlg(${p.id})">Import cookies</button>
        <button ${busy ? "disabled" : ""} onclick="exportCookies(${p.id})">Export cookies</button>
        <button onclick="exportDlg(${p.id})">Export account</button>
        ${p.running && canAdmin() && !p.running_here ? `<button style="color:var(--bad)" onclick="if(confirm('Force-release the lock? Unsynced changes on the other device will be rejected.'))act(()=>api('POST','/profiles/${p.id}/unlock'))">Force unlock</button>` : ""}
      </div></span></div>
    </td></tr>`;
}
function toggleMenu(id, e) { e.stopPropagation(); document.querySelectorAll(".menu.open").forEach(m => m.id !== "m" + id && m.classList.remove("open")); $("#m" + id).classList.toggle("open"); }
document.addEventListener("click", () => document.querySelectorAll(".menu.open").forEach(m => m.classList.remove("open")));

async function cloud(id, btn) {
  const w = window.open("about:blank");
  const r = await act(() => api("POST", `/profiles/${id}/cloud`, {}), btn);
  if (r && r.view) { if (w) w.location = r.view; else prompt("Open this link on any device:", r.view); } else if (w) w.close();
}

function dlg(html) { const d = $("#dlg"); d.innerHTML = html + `<div class="err" id="derr"></div>`; d.showModal(); }
const close_ = () => $("#dlg").close();
const osSel = (id, v, canvasId) => `<select id="${id}" ${canvasId ? `onchange="$('#${canvasId}').value = this.value === S.host_os ? 'real' : 'noise'"` : ""}>${["windows","macos","linux"].map(o => `<option value="${o}" ${o===v?"selected":""}>${o}${o===S.host_os ? " (this machine: best)" : ""}</option>`).join("")}</select>`;
const canvasSel = (id, v) => `<select id="${id}"><option value="noise" ${v!=="real"?"selected":""}>noise: random per read, works on any OS</option><option value="real" ${v==="real"?"selected":""}>real: this machine's rendering (same OS only)</option></select>`;

function newDlg() {
  dlg(`<h3>Add an account</h3>
    ${S.templates.length ? `<label>Template</label><select id="n_tpl" onchange="applyTpl(this.value)"><option value="">none</option>${S.templates.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join("")}</select>` : ""}
    <label>Name</label><input id="n_name">
    <label>Proxy (strongly recommended: one per account): scheme://user:pass@host:port</label><input id="n_proxy" placeholder="http://user:pass@1.2.3.4:8080">
    <div class="mute small">Tip: for a proxynet gateway (or any session proxy), put <code>{pid}</code> in the username to give this browser its own sticky exit, e.g. <code>http://country-us-session-{pid}:PASS@gateway:8899</code>. Save it as a template to reuse.</div>
    <label>Start URL</label><input id="n_url" placeholder="https://">
    <label>Tags (comma separated)</label><input id="n_tags">
    <label>Notes</label><input id="n_notes">
    <details style="margin-top:10px"><summary class="mute small" style="cursor:pointer">Advanced: browser identity (the defaults are right for most people)</summary>
      <div class="grid2"><div><label>OS fingerprint</label>${osSel("n_os",S.host_os,"n_canvas")}</div><div><label>Canvas</label>${canvasSel("n_canvas","real")}</div></div>
      <p class="mute small">An account that uses this machine's OS shows its real canvas and fonts, which passes checkers such as Pixelscan. Other OSes need canvas noise, and Pixelscan flags that.</p></details>
    <div class="row" style="margin-top:16px"><button class="b p" id="n_go" onclick="createProfile()">Create</button><button class="b" onclick="close_()">Cancel</button></div>`);
}
function applyTpl(id) {
  const t = S.templates.find(x => x.id == id); if (!t) return; const s = t.settings;
  $("#n_os").value = s.os || "windows"; $("#n_canvas").value = s.canvas || "noise"; $("#n_proxy").value = s.proxy || "";
  $("#n_url").value = s.start_url || ""; $("#n_tags").value = (s.tags || []).join(", ");
}
const tags = v => v.split(",").map(s => s.trim()).filter(Boolean);
async function createProfile() {
  const b = $("#n_go"); b.disabled = true; b.textContent = "Generating fingerprint…";
  try {
    await api("POST", "/profiles", { name: $("#n_name").value.trim(), os: $("#n_os").value, canvas: $("#n_canvas").value,
      proxy: $("#n_proxy").value.trim(), start_url: $("#n_url").value.trim(), notes: $("#n_notes").value, tags: tags($("#n_tags").value) });
    close_(); await load();
  } catch (e) { $("#derr").textContent = e.message; b.disabled = false; b.textContent = "Create"; }
}

function bulkDlg() {
  dlg(`<h3>Add many accounts</h3>
    <div class="grid2"><div><label>How many</label><input id="b_n" type="number" value="10" min="1" max="500"></div><div><label>Name pattern ({n} = number)</label><input id="b_name" value="Profile {n}"></div></div>
    <div class="grid2"><div><label>OS fingerprint</label>${osSel("b_os",S.host_os,"b_canvas")}</div><div><label>Canvas</label>${canvasSel("b_canvas","real")}</div></div>
    <label>Proxies, one per line, assigned round-robin (optional)</label><textarea id="b_px" placeholder="http://user:pass@1.2.3.4:8080"></textarea>
    <label>Tags</label><input id="b_tags">
    <label>Start URL</label><input id="b_url">
    <p class="mute small">Every profile gets its own fingerprint. Generating takes about a second each.</p>
    <div class="row"><button class="b p" id="b_go" onclick="bulkGo()">Create</button><button class="b" onclick="close_()">Cancel</button></div>`);
}
async function bulkGo() {
  const b = $("#b_go"); b.disabled = true; b.textContent = "Creating…";
  try {
    const r = await api("POST", "/profiles/bulk", { count: +$("#b_n").value, name: $("#b_name").value, os: $("#b_os").value,
      canvas: $("#b_canvas").value, proxies: $("#b_px").value.split("\n"), tags: tags($("#b_tags").value), start_url: $("#b_url").value.trim() });
    close_(); await load(); alert(`Created ${r.created} profiles.`);
  } catch (e) { $("#derr").textContent = e.message; b.disabled = false; b.textContent = "Create"; }
}

async function editDlg(id) {
  const p = S.profiles.find(x => x.id === id);
  const px = (await api("GET", `/profiles/${id}/proxy`)).proxy;
  dlg(`<h3>Edit ${esc(p.name)}</h3>
    <label>Name</label><input id="e_name" value="${esc(p.name)}">
    <label>Proxy (empty = direct)</label><input id="e_proxy" value="${esc(px)}">
    <label>Canvas</label>${canvasSel("e_canvas", p.canvas)}
    <label>Start URL</label><input id="e_url" value="${esc(p.start_url)}">
    <label>Notes</label><input id="e_notes" value="${esc(p.notes)}">
    <p class="mute small">The fingerprint (${esc(p.os)}) is fixed for this profile's life.</p>
    <div class="row" style="margin-top:16px">

// ---------------------------------------------------------------- Pigeon panel: every feature, for one open session
let PG = null;
const pgApi = (path, body) => api("POST", `/profiles/${PG.id}/pigeon/${path}`, body);
const pgOp = (op, args) => pgApi("op", { op, args: args || {} });
const pgJob = (kind, args) => pgApi("job", { kind, args: args || {} });
const pgTabs = ["leads", "run", "comments", "messages", "setup", "settings", "brain"];
const PG_LABEL = { leads: "People", run: "Run", comments: "Comments", messages: "Messages", setup: "Product", settings: "Settings", brain: "Team activity" };
const LEAD_WORDS = { queued: "waiting for a message", draft: "needs your approval", ready: "approved", sent: "sent", replied: "replied", failed: "failed", skipped: "skipped" };
const SETTING_LABELS = { model: "AI model", my_username: "This account's Reddit username", daily_dm_cap: "Max messages per day", warmup: "Start slowly (warm-up)",
  active_start: "Only work from this hour (0-23)", active_end: "Only work until this hour (0-23)", min_gap_sec: "Shortest wait between messages (seconds)",
  max_gap_sec: "Longest wait between messages (seconds)", pace: "Speed (1 = normal, lower = slower)", min_fit: "Minimum match score (0-100)",
  session_minutes: "How long each run lasts (minutes)", upvotes: "Upvote posts while browsing", max_upvotes_per_session: "Max upvotes per run",
  dm_mode: "How messages are written (ai or template)", approve_ai_drafts: "I approve AI-written messages first", ai_guidance: "Extra instructions for the AI",
  use_team_setup: "Use the team's shared setup", auto_check_replies: "Check for replies automatically", posts_per_day: "Max posts per day" };
function pgNext(busy) {   // the one thing to do next, in a sentence
  const st = PG.st; if (!st) return "";
  const n = k => (st.leads && st.leads[k]) || 0;
  let msg, go = null;
  if (st.state === "stopping") msg = "Stopping… the browser stays open.";
  else if (busy) msg = "Pigeon is working in its own tab. You can keep using the browser. Nothing for you to do.";
  else if (!st.product) { msg = "<b>Start here:</b> tell Pigeon what you're promoting, so it knows who to look for."; go = ["setup", "Go to Product"]; }
  else if (n("draft")) { msg = `<b>${n("draft")} message${n("draft") > 1 ? "s are" : " is"} waiting for you.</b> Read them and press Approve.`; go = ["leads", "Review messages"]; }
  else if (n("ready")) { msg = `<b>${n("ready")} approved message${n("ready") > 1 ? "s are" : " is"} ready.</b> Press Start (mode: send approved messages) to send them.`; go = ["run", "Go to Run"]; }
  else if (!st.stats.leads) { msg = "<b>Next:</b> press Start to find people to message."; go = ["run", "Go to Run"]; }
  else msg = "All caught up. Press Start on the Run tab to find more people.";
  return `<div class="banner" style="margin:0 0 10px"><div>${msg}</div><span class="sp"></span>${go ? `<button class="b p" onclick="pgTab('${go[0]}')">${go[1]}</button>` : ""}</div>`;
}

function pgOpen(id) {
  PG = { id, tab: "leads", filter: "all", msg: "", edit: {} };
  const d = $("#dlg"); d.style.width = "min(980px,94vw)";
  d.innerHTML = `<div id="pg"></div>`; d.showModal();
  $("#pg").addEventListener("input", () => { if (PG) PG.dirty = true; });  // typed-but-unsaved text must survive the periodic refresh
  d.addEventListener("close", pgClosed, { once: true });
  pgRefresh(true);
  PG.timer = setInterval(() => pgRefresh(false), 2500);
}
function pgClosed() { if (PG) clearInterval(PG.timer); PG = null; $("#dlg").style.width = ""; }
function pgTab(t) { PG.tab = t; PG.msg = ""; PG.dirty = false; pgRefresh(true); }
async function pgGo(fn, okMsg) {
  try { const r = await fn(); PG.msg = okMsg === undefined ? (r && r.out) || "" : okMsg; PG.err = ""; }
  catch (e) { PG.err = e.message; }
  PG.dirty = false;  // whatever was typed has now been acted on; show the server's state
  await pgRefresh(true);
}
const editing = () => ["TEXTAREA", "INPUT", "SELECT"].includes((document.activeElement || {}).tagName);

async function pgRefresh(force) {
  if (!PG) return;
  const me = PG, gen = (me.gen = (me.gen || 0) + 1);  // a newer refresh supersedes this one; a slow, older response must not overwrite fresher data
  const stale = () => PG !== me || me.gen !== gen;
  try {
    const st = await api("GET", `/profiles/${me.id}/pigeon/status`);
    if (stale()) return;
    me.st = st;
    if (!force && (editing() || me.dirty)) return pgBar();       // don't clobber what you're typing (or typed and haven't saved yet)
    const t = me.tab, d = {};
    if (t === "leads") d.leads = (await pgOp("leads_list")).leads;
    if (t === "comments") { d.opps = (await pgOp("opps_list")).opportunities; d.ideas = (await pgOp("ideas_list")).ideas; d.posted = (await pgOp("posts_list")).posted; }
    if (t === "messages") { d.tpl = await pgOp("template_show"); d.settings = (await pgOp("settings_set")).settings; }
    if (t === "setup") { d.product = (await pgOp("product_show")).product; d.subs = (await pgOp("subs_edit")).subreddits; }
    if (t === "settings") d.settings = (await pgOp("settings_set")).settings;
    if (t === "brain") d.brain = await api("GET", "/pigeon/brain");
    if (stale()) return;
    Object.assign(me, d);
  } catch (e) { if (!stale()) me.err = e.message; }
  if (stale()) return;
  if (!force && (editing() || me.dirty)) return pgBar();  // the user started typing while this refresh was in flight: don't wipe it
  pgRender();
}

function pgBar() {
  const st = PG.st, el = $("#pgbar"); if (!el || !st) return;
  const on = st.state !== "idle", last = (st.log || []).slice(-1)[0];
  el.innerHTML = `<span class="pill ${on ? "run" : ""}">🕊 ${esc(pigeonWords(st))}</span>
    ${on ? `<button class="b d" onclick="pgGo(()=>pgApi('stop'),'stopping…')">Stop</button>` : ""}
    <span class="mute small"> looked at ${st.stats.scanned} · found ${people(st.stats.leads)} · sent ${msgs(st.stats.dms)} · ${st.daily.count} today${st.central ? " · team history: on" : ""}</span>
    ${st.central ? "" : `<div class="err small">Team history is OFF: this account can't see who your other accounts already messaged.</div>`}
    ${last ? `<div class="log">${esc(last.msg)}</div>` : ""}
    ${st.last && !st.last.ok && st.last.error ? `<div class="err small">${esc(st.last.kind)}: ${esc(st.last.error)}</div>` : ""}`;
}

function pgRender() {
  const busy = PG.st && PG.st.state !== "idle";
  $("#pg").innerHTML = `<div class="row" style="justify-content:space-between"><h3 style="margin:0">Pigeon · ${esc((S.profiles.find(p => p.id === PG.id) || {}).name || "account " + PG.id)}</h3><button class="b" onclick="$('#dlg').close()">Close</button></div>
    <div id="pgbar" style="margin:8px 0"></div>
    ${pgNext(busy)}
    <div class="row" style="gap:4px;margin-bottom:10px;flex-wrap:wrap">${pgTabs.map(t => `<button class="b ${PG.tab === t ? "p" : ""}" onclick="pgTab('${t}')">${PG_LABEL[t]}</button>`).join("")}</div>
    ${PG.err ? `<div class="err small">${esc(PG.err)}</div>` : ""}${PG.msg ? `<pre class="log">${esc(PG.msg)}</pre>` : ""}
    <div>${({ leads: pgLeads, run: pgRun, comments: pgComments, messages: pgMessages, setup: pgSetup, settings: pgSettings, brain: pgBrain })[PG.tab](busy)}</div>`;
  pgBar();
}

function pgLeads(busy) {
  const L = PG.leads || [], shown = L.filter(l => PG.filter === "all" || l.status === PG.filter);
  const sts = ["all", "queued", "draft", "ready", "sent", "replied", "failed", "skipped"];
  return `<div class="row" style="margin-bottom:8px">
    <select onchange="PG.filter=this.value;pgRender()">${sts.map(s => `<option value="${s}" ${PG.filter === s ? "selected" : ""}>${s === "all" ? "everyone" : LEAD_WORDS[s]}</option>`).join("")}</select>
    <button class="b" onclick="pgGo(()=>pgOp('lead_write',{all:true}))">Write all queued</button>
    <button class="b" onclick="pgGo(()=>pgOp('lead_approve',{all:true}))">Approve all drafts</button>
    <button class="b" onclick="pgExport()">Export CSV</button>
    <button class="b d" onclick="if(confirm('Delete ALL leads?'))pgGo(()=>pgOp('leads_clear'))">Clear all</button></div>
  ${shown.slice(0, 100).map(l => { const u = esc(l.username), sent = l.status === "sent" || l.status === "replied";
    return `<div class="card" style="padding:10px;margin-bottom:8px"><div class="row"><a href="https://www.reddit.com/user/${u}" target="_blank"><b>u/${u}</b></a>
      <span class="pill">${l.fit}</span><span class="pill">${esc(LEAD_WORDS[l.status] || l.status)}</span><span class="mute small">${l.subreddit ? "r/" + esc(l.subreddit) : ""}</span></div>
      <div class="small mute">${esc(l.reason)}${l.error ? ` <span class="err">· ${esc(l.error)}</span>` : ""}</div>
      ${l.message || PG.edit[l.username] != null ? `<textarea style="width:100%;min-height:70px" ${sent ? "disabled" : ""} oninput="PG.edit['${u}']=this.value">${esc(PG.edit[l.username] ?? l.message)}</textarea>` : ""}
      <div class="row" style="margin-top:6px">
        ${PG.edit[l.username] != null ? `<button class="b p" onclick="pgSave('${u}')">Save</button>` : ""}
        ${l.status === "queued" || l.status === "failed" ? `<button class="b" onclick="pgGo(()=>pgOp('lead_write',{username:'${u}'}))">Write message</button>` : ""}
        ${l.status === "draft" ? `<button class="b p" onclick="pgGo(()=>pgOp('lead_approve',{username:'${u}'}))">Approve</button>` : ""}
        ${l.status === "draft" || l.status === "ready" ? `<button class="b p" ${busy ? "disabled" : ""} onclick="pgGo(()=>pgJob('send',{username:'${u}'}),'sending…')">Send now</button>` : ""}
        ${l.status === "sent" ? `<button class="b" onclick="pgGo(()=>pgOp('lead_replied',{username:'${u}'}))">Mark replied</button>` : ""}
        ${!sent && l.status !== "skipped" ? `<button class="b" onclick="pgGo(()=>pgOp('lead_skip',{username:'${u}'}))">Skip</button>` : ""}</div></div>`; }).join("") || `<div class="mute">No leads here. Run the agent in “find” mode, scan a page, or import a list.</div>`}
  <h4>Add people by username</h4><div class="mute small">One username per line. People your team already contacted are skipped.</div>
  <textarea id="pgimp" style="width:100%;min-height:60px"></textarea>
  <button class="b" onclick="pgGo(()=>pgOp('leads_import',{text:$('#pgimp').value}))">Import to queue</button>`;
}
async function pgSave(u) { const m = PG.edit[u]; delete PG.edit[u]; await pgGo(() => pgOp("lead_edit", { username: u, message: m }), "saved"); }
async function pgExport() {
  const r = await pgOp("leads_export"); const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([r.csv], { type: "text/csv" })); a.download = "pigeon-leads.csv"; a.click();
}

function pgRun(busy) {
  return `<div class="card" style="padding:12px"><b>Start Pigeon</b><div class="row" style="margin-top:8px">
      <select id="pgmode"><option value="find">Find people (sends nothing)</option><option value="dm">Send approved messages</option><option value="full">Find people + message them</option></select>
      <input id="pgmin" type="number" placeholder="how many minutes (optional)" style="width:200px">
      <button class="b p" ${busy ? "disabled" : ""} onclick="pgGo(()=>pgJob('run',{mode:$('#pgmode').value,minutes:parseFloat($('#pgmin').value)||null}),'started')">▶ Start</button></div>
      <div class="mute small" style="margin-top:6px">The agent works in its own tab; your tabs are left alone. DMs and comments go through the daily cap and the team's shared memory.</div></div>
    <div class="card" style="padding:12px;margin-top:10px"><b>Add the people on this page</b><div class="mute small">Adds everyone on the Reddit page you're looking at to the list.</div>
      <label class="small"><input type="checkbox" id="pgns"> skip AI scoring</label>
      <button class="b" ${busy ? "disabled" : ""} onclick="pgGo(()=>pgJob('scan',{no_score:$('#pgns').checked}),'scanning…')">Queue everyone on this page</button></div>
    <div class="card" style="padding:12px;margin-top:10px"><button class="b" ${busy ? "disabled" : ""} onclick="pgGo(()=>pgJob('replies'),'checking…')">Check replies</button></div>
    <div class="card" style="padding:12px;margin-top:10px"><b>Check that Reddit works with Pigeon</b>
      <div class="mute small">Safe: it only looks, it sends nothing. Run it once on a new account.</div>
      <button class="b" ${busy ? "disabled" : ""} onclick="pgGo(()=>pgJob('doctor'),'checking Reddit… (the report appears here)')">Run the check</button>
      ${PG.st && PG.st.last && PG.st.last.kind === "doctor" && PG.st.last.out ? `<pre class="log">${esc(PG.st.last.out)}</pre>` : ""}</div>`;
}

function pgComments(busy) {
  const O = PG.opps || [], I = PG.ideas || [];
  return `<h4>Comment opportunities</h4>` + (O.map(o => `<div class="card" style="padding:10px;margin-bottom:8px"><div class="row"><b>r/${esc(o.subreddit)}</b> ${esc(o.title)}
      <span class="pill">${esc(o.status)}</span><a class="small" href="${esc(o.post_url)}" target="_blank">thread ↗</a></div><div class="small mute">${esc(o.why)}</div>
      <pre class="log">${esc(o.draft)}</pre>${o.status === "pending" ? `<div class="row"><button class="b p" ${busy ? "disabled" : ""} onclick="pgGo(()=>pgJob('post',{id:${JSON.stringify(o.id).replace(/"/g, "&quot;")}}),'posting…')">Approve &amp; post</button>
      <button class="b" onclick="pgGo(()=>pgOp('opp_skip',{id:${JSON.stringify(o.id).replace(/"/g, "&quot;")}}))">Skip</button></div>` : ""}</div>`).join("") || `<div class="mute">None yet. They're drafted while the agent browses.</div>`) +
    `<h4>Post ideas</h4><button class="b" onclick="pgGo(()=>pgOp('ideas_generate'),'writing ideas…')">Generate 5 post ideas</button>` +
    I.map(i => `<div class="card" style="padding:10px;margin:8px 0"><b>r/${esc(i.subreddit)}</b> — ${esc(i.title)}<pre class="log">${esc(i.body)}</pre><div class="small mute">${esc(i.angle)}</div>
      <div class="row"><button class="b" onclick="navigator.clipboard.writeText(${JSON.stringify(i.title + "\n\n" + i.body).replace(/"/g, "&quot;")})">Copy</button>
      <a class="b" href="https://www.reddit.com/r/${esc(i.subreddit)}/submit" target="_blank">Open submit page</a>
      <button class="b p" ${busy ? "disabled" : ""} onclick="if(confirm('Submit this to r/${esc(i.subreddit)} now, from this account?'))pgGo(()=>pgJob('submit',{id:'${esc(i.id)}'}),'posting…')">Submit now</button>
      <button class="b" onclick="pgGo(()=>pgOp('idea_posted',{id:'${esc(i.id)}'}))">I posted it myself</button></div></div>`).join("") +
    ((PG.posted || []).length ? `<h4>Posted by the agent</h4>` + PG.posted.map(x => `<div class="small"><b>r/${esc(x.subreddit)}</b> ${esc(x.title)} <a href="${esc(x.url)}" target="_blank">thread ↗</a></div>`).join("") : "");
}

function pgMessages() {
  const s = PG.settings || {}, t = PG.tpl || {};
  return `<div class="row"><button class="b ${s.dm_mode === "ai" ? "p" : ""}" onclick="pgGo(()=>pgOp('settings_set',{pairs:{dm_mode:'ai'}}),'')">AI writes each DM</button>
      <button class="b ${s.dm_mode === "template" ? "p" : ""}" onclick="pgGo(()=>pgOp('settings_set',{pairs:{dm_mode:'template'}}),'')">Use my template</button>
      <label class="small"><input type="checkbox" ${s.approve_ai_drafts ? "checked" : ""} onchange="pgGo(()=>pgOp('settings_set',{pairs:{approve_ai_drafts:this.checked}}),'')"> AI drafts wait for my approval</label></div>
    <h4>Template</h4><div class="mute small">{Hey|Hi|Hello} {name}, … — variables: {name} {subreddit} {topic}</div>
    <textarea id="pgtpl" style="width:100%;min-height:110px">${esc(t.template || "")}</textarea>
    <div class="row"><button class="b p" onclick="pgGo(()=>pgOp('template_set',{body:$('#pgtpl').value}),'saved')">Save</button>
      <select id="pgint"><option>light</option><option selected>medium</option><option>heavy</option></select>
      <button class="b" onclick="pgGo(()=>pgOp('template_spin',{intensity:$('#pgint').value}).then(r=>({out:'✨ spun. '+r.out})))">✨ Add spintax with AI</button>
      <button class="b" onclick="pgGo(()=>pgOp('template_preview',{n:4}))">Preview variations</button>
      ${t.undo ? `<button class="b" onclick="pgGo(()=>pgOp('template_undo'),'restored')">Undo AI spin</button>` : ""}</div>`;
}

function pgSetup(busy) {
  const p = PG.product, S_ = PG.subs || [];
  return `<div class="row"><input id="pgurl" placeholder="https://your-product.com" style="flex:1" value="${esc(p ? p.url : "")}">
      <button class="b p" ${busy ? "disabled" : ""} onclick="pgGo(()=>pgJob('setup',{url:$('#pgurl').value}),'analyzing + finding subreddits…')">${p ? "Re-analyze" : "Analyze my product"}</button></div>
    ${p ? `<div class="card small" style="padding:10px;margin:8px 0"><b>${esc(p.name)}</b> — ${esc(p.summary)}<br><span class="mute">ICP:</span> ${esc(p.icp)}<br><span class="mute">Offer:</span> ${esc(p.offer)}</div>` : ""}
    <h4>Subreddits</h4><div class="row"><button class="b" ${busy || !p ? "disabled" : ""} onclick="pgGo(()=>pgJob('discover'),'finding subreddits…')">Re-run discovery</button>
      <input id="pgadd" placeholder="add r/name" style="width:160px"><button class="b" onclick="pgGo(()=>pgOp('subs_edit',{add:[$('#pgadd').value]}),'')">Add</button></div>
    <table style="margin-top:8px">${S_.map(x => `<tr><td><input type="checkbox" ${x.enabled ? "checked" : ""} onchange="pgGo(()=>pgOp('subs_edit',{[this.checked?'enable':'disable']:['${esc(x.name)}']}),'')"></td>
      <td>r/${esc(x.name)}</td><td class="small">score ${x.score}</td><td class="small">rules: ${esc(x.rules_risk)}</td><td class="small mute">${esc(x.reason)}</td>
      <td><button class="b" onclick="pgGo(()=>pgOp('subs_edit',{remove:['${esc(x.name)}']}),'')">✕</button></td></tr>`).join("") || `<tr><td class="mute">No subreddits yet.</td></tr>`}</table>`;
}

function pgSettings() {
  const s = PG.settings || {};
  return `<div style="display:grid;grid-template-columns:240px 1fr;gap:6px;max-width:560px">${Object.entries(s).filter(([k]) => k !== "warmup_start").map(([k, v]) =>
    `<label class="small">${esc(SETTING_LABELS[k] || k)}</label>${typeof v === "boolean" ? `<input type="checkbox" data-k="${k}" ${v ? "checked" : ""}>` : `<input data-k="${k}" value="${esc(v)}">`}`).join("")}</div>
    <div class="row" style="margin-top:10px"><button class="b p" onclick="pgSaveSettings()">Save settings</button>
      <button class="b" onclick="pgGo(()=>pgOp('settings_set',{restart_warmup:true}),'warm-up restarted from today')">Restart warm-up from today</button></div>
    <div class="mute small" style="margin-top:6px">The DeepSeek key stays on this machine: <code>loft pigeon config --deepseek-key KEY</code>.</div>`;
}
function pgSaveSettings() {
  const pairs = {}; document.querySelectorAll("#pg [data-k]").forEach(el => { pairs[el.dataset.k] = el.type === "checkbox" ? el.checked : el.value; });
  pgGo(() => pgOp("settings_set", { pairs }), "saved");
}

function pgBrain() {
  const b = PG.brain; if (!b) return `<div class="mute">loading…</div>`;
  const k = b.summary.by_kind, when = t => new Date(t * 1000).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
  return `<div class="row" style="margin-bottom:6px"><button class="b" onclick="pgGo(()=>pgOp('brain_backfill'))">Record this account's past DMs &amp; comments</button>
      <span class="mute small">so other accounts don't repeat them</span></div>
    <div class="row" style="margin-bottom:6px"><button class="b" onclick="pgGo(()=>pgOp('team_pull',{force:true}))">Pull team setup</button>
      <button class="b" onclick="if(confirm('Share the product, subreddits, template and shared settings of this account with the whole team?'))pgGo(()=>pgOp('team_publish'))">Publish this account's setup to the team</button>
      <span class="mute small">team setup v${b.team_setup.version}${b.team_setup.product ? " · " + esc(b.team_setup.product) : ""} · ${b.team_setup.subreddits} subreddits ·
        limits: ${Object.entries(b.team_setup.limits).map(([a, v]) => esc(a) + "=" + v).join(", ") || "none"}</span></div>
    <div class="small" style="margin-bottom:6px"><b>Our accounts:</b> ${b.accounts.map(a => "u/" + esc(a.username) + " (" + esc(a.profile || "#" + a.profile_id) + ")").join(" · ") || '<span class="mute">none registered yet; they register when the agent runs</span>'}</div>
    <div><b>Team memory · last ${b.summary.days} days, every account:</b> ${k.dm || 0} DMs · ${k.reply || 0} replies · ${k.comment || 0} comments · ${k.post || 0} posts · ${k.upvote || 0} upvotes
      ${b.summary.stuck_claims ? `<span class="err"> · ${b.summary.stuck_claims} stuck claim(s)</span>` : ""}</div>
    <table style="margin:8px 0"><tr><th>Subreddit</th><th>DMs</th><th>Replies</th><th>Comments</th><th>Posts</th><th>Upvotes</th><th>Last</th></tr>${b.summary.by_subreddit.map(r => `<tr><td>r/${esc(r.subreddit)}</td><td>${r.dms}</td><td>${r.replies}</td><td>${r.comments}</td><td>${r.posts}</td><td>${r.upvotes}</td><td class="small">${when(r.last_at)}</td></tr>`).join("")}</table>
    <table><tr><th>Account</th><th>DMs</th><th>Replies</th><th>Comments</th><th>Posts</th><th>Upvotes</th></tr>${b.summary.by_profile.map(r => `<tr><td>${esc(r.profile || "-")}</td><td>${r.dms}</td><td>${r.replies}</td><td>${r.comments}</td><td>${r.posts}</td><td>${r.upvotes}</td></tr>`).join("")}</table>
    <h4>Recent</h4><table>${b.events.map(e => `<tr><td class="small">${when(e.at)}</td><td>${esc(e.kind)}</td><td>${esc(e.status)}</td><td>${esc(e.profile || "-")}</td><td>r/${esc(e.subreddit || "-")}</td><td class="small">${esc((e.kind === "dm" ? e.target : e.title || e.target).slice(0, 70))}</td></tr>`).join("") || `<tr><td class="mute">Nothing yet.</td></tr>`}</table>`;
}

setInterval(() => { if (S && S.signed_in && tab === "profiles" && !$("#dlg").open && !document.querySelector(".menu.open")) load().catch(() => {}); }, 3000);
</script>
</body>
</html>
