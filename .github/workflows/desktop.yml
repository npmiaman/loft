name: desktop builds
# Manual or on a version tag only: each run uses Actions minutes.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            extras: --extra desktop --extra build
            artifact: Pigeon-macos-arm64
          - os: windows-latest
            extras: --extra desktop --extra build
            artifact: Pigeon-windows-x64
          - os: ubuntu-22.04
            extras: --extra build   # no native window on Linux builds: the app opens the system browser
            artifact: Pigeon-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync ${{ matrix.extras }}
      - run: uv run pytest -q tests/test_server.py tests/test_desktop.py
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: build the web UI (the packaged app serves it; without this it falls back to the classic page)
        working-directory: web
        run: npm ci && npm run build
      - run: uv run pyinstaller packaging/pigeon.spec --noconfirm --distpath dist --workpath build
      - name: smoke test the frozen binary
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then B=dist/Pigeon.app/Contents/MacOS/Pigeon; elif [ "$RUNNER_OS" = "Windows" ]; then B=dist/Pigeon/Pigeon.exe; else B=dist/Pigeon/Pigeon; fi
          "$B" --help | head -5
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          retention-days: 14
